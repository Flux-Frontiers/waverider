name: Release

on:
  push:
    tags: ['v*']
  # Publish an already-released tag to PyPI without re-releasing it. Takes the
  # assets off the existing GitHub Release, so PyPI gets the same bytes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.15.0"
        required: true

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only main --no-interaction

      - name: Build wheel and sdist
        run: poetry build

      # Hand the built files to the publish job rather than letting it rebuild,
      # so PyPI and the GitHub Release carry byte-identical artifacts.
      - name: Stash dist for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "WaveRider $TAG" \
              --notes-file release-notes.md
          fi

  fetch-release:
    name: Fetch assets of an existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download the release's wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - name: Stash dist for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [release, fetch-release]
    # Exactly one of the two producers runs; the other is skipped.
    if: >-
      always() &&
      (needs.release.result == 'success' || needs.fetch-release.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waverider
    # Replaces the workflow-level `contents: write` for this job: publishing
    # needs to mint an OIDC token and nothing else.
    permissions:
      id-token: write
    steps:
      - name: Fetch the artifacts the producing job stashed
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
