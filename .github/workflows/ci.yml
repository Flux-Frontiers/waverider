name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # Lint only needs ruff, so skip the heavy runtime deps (tensorflow et al).
      - name: Install dev dependencies
        run: poetry install --only dev --no-interaction --no-root

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only main,dev --no-interaction

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # The viz group (pyvista/VTK) and the kg extras are deliberately omitted.
      # Tests that need a render window skip themselves.  The quilt geometry
      # tests this comment used to point at moved to quiltwright at 0.13.0 and
      # are covered by that repo's CI.
      - name: Install dependencies
        run: poetry install --only main,dev --no-interaction

      - name: Run tests
        run: poetry run pytest -m "not integration"
