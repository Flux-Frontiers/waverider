# pyproject.toml — waverider package configuration
#
# Author: Eric G. Suchanek, PhD
#
# Extras are user-facing features; dev/benchmarks/viz are Poetry groups, so
# none of them ship in the wheel. See FLEET_STANDARDS.md.
#
# Quick install (poetry)
# ----------------------
#   poetry install                               core runtime only
#   poetry install --with benchmarks             core + scientific computing for benchmarks
#   poetry install --with viz                    core + voxel/Streamlit visualization
#   poetry install --with benchmarks,viz         full install
#   poetry install --extras "kg"                 core + KG integrations (doc-kg, pycode-kg, proteuspy)
#   poetry install --all-extras --with dev       everything
#
# Quick install (pip)
# -------------------
#   pip install -e "."                           core only
#   pip install -e ".[kg]"                       core + KG integrations
#
# Run tests
# ---------
#   pytest                                       uses [tool.pytest.ini_options]
#   pytest -m "not slow"                         skip slow tests
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .                      rebuild code KG (always wipes)
#   dockg build --repo .                         rebuild doc KG

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "waverider", from = "src"}]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "waverider"
version = "0.14.0"
description = "Manifold-aware geometric ML stack: TurtleND, ManifoldWalker, ManifoldModel, ManifoldObserver"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["manifold-learning", "intrinsic-dimensionality", "geometric-deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    # Holographic output, split out of this package at 0.13.0.  Core is
    # numpy + pillow only; the PyVista backend comes in via the viz group.
    # >=0.4.0 unmarked, per the fleet standard: 0.4.0 widened requires-python
    # to <3.14 and supplies depth_report(). Earlier versions pinned <3.13 and
    # needed a `; python_version < '3.13'` marker to lock at all — that marker
    # is obsolete and must not come back.
    "quiltwright>=0.7.0",
    "scikit-learn>=1.3",
    "tensorflow==2.21.0",
    "tf-keras>=2.16.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.4",
]

[project.optional-dependencies]
kg = [
    "doc-kg>=0.22.0",
    "pycode-kg>=0.23.1",
    "proteuspy>=0.100.1",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/waverider"
Repository = "https://github.com/Flux-Frontiers/waverider"

[project.scripts]
waverider-voxel-viz = "waverider.voxel_viz:main"

# `optional = true` on all three groups below: without it Poetry installs a
# group by default, so a bare `poetry install` was pulling dev, benchmarks and
# viz — contradicting this file's own header, which documents `--with` for each.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pdoc           = ">=14.0.0"
pre-commit     = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest         = ">=9.0.3"
pytest-cov     = ">=5.0.0"
# Capped below 0.16 to match the fleet: 0.16 formats Python inside Markdown
# code blocks. Unbounded, the lock could drift from the pre-commit hook's pin.
ruff           = ">=0.4.0,<0.16"
ty = ">=0.0.44"

[tool.poetry.group.benchmarks]
optional = true

[tool.poetry.group.benchmarks.dependencies]
# Core scientific computing for canonical benchmark scripts
# Install with: poetry install --with benchmarks
#
# System LaTeX required for .tex → PDF compilation in report_generator.py:
#   macOS  : brew install --cask mactex   (or mactex-no-gui)
#   Ubuntu : apt install texlive-latex-extra texlive-fonts-recommended latexmk
#   Arch   : pacman -S texlive-latexextra
# Without a LaTeX compiler the generator falls back to the matplotlib PDF.
matplotlib = ">=3.7"
scipy      = ">=1.11"
openpyxl   = ">=3.1"
# Real-embedding KV-cache extraction for manifold_reach_calibration.py's
# Phase 2 (MANIFOLD_REACH_QUANTIZATION_PLAN.md). CPU-only PyTorch is enough:
# the models here (GPT-2 small and similar) only need a forward pass, not
# training, over a few hundred short sequences.
transformers = ">=4.45"
torch        = ">=2.4"
# Reads the WikiText-2 parquet directly from the HF Hub (transformers'
# huggingface_hub does the download) -- pulling in the full `datasets`
# package just for one file would be a much heavier dependency for the
# same result.
pyarrow      = ">=17.0"

[tool.poetry.group.viz]
optional = true

[tool.poetry.group.viz.dependencies]
# Rendering and interactive visualisation stack
#   Desktop viewer : waverider-voxel-viz  (PyVista / VTK)
#   Web app        : manifold_voxel_app.py  (Streamlit + Plotly)
# Install with: poetry install --with viz
# Full install  : poetry install --with benchmarks,viz
pyvista   = { version = ">=0.47.3", extras = ["jupyter"] }
scipy     = ">=1.11"
streamlit = ">=1.35"
plotly    = ">=6.0"
pillow    = ">=10.0"
# Bundled ffmpeg for quilt video encoding (quiltwright.lfd)
imageio-ffmpeg = ">=0.5"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root           = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# The viz stack (pyvista/VTK) is an optional group, so in the lean CI install
# its imports are Unknown, the errors it triggers never fire, and any local
# suppressions look "unused". Don't fail the build on that.
unused-type-ignore-comment = "ignore"

[[tool.ty.overrides]]
# Legacy proteusPy code — numpy.array used as type hints, not worth rewriting.
include = ["src/waverider/turtle3D.py"]

[tool.ty.overrides.rules]
invalid-type-form    = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
call-non-callable    = "ignore"

[[tool.ty.overrides]]
# Optional fields are None only before fit(); methods are only called post-fit.
include = ["src/waverider/manifold_model.py", "src/waverider/manifold_observer.py"]

[tool.ty.overrides.rules]
unresolved-attribute  = "ignore"
not-subscriptable     = "ignore"
invalid-argument-type = "ignore"
invalid-assignment    = "ignore"
no-matching-overload  = "ignore"
unsupported-operator  = "ignore"

[[tool.ty.overrides]]
# PyVista wraps plotter methods in functools.wraps, which ty resolves to the
# wrapper's signature rather than the wrapped method's. False positives.
include = ["src/waverider/voxel_viz.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
missing-argument      = "ignore"

[[tool.ty.overrides]]
# TODO: SteeringStrategy subclasses redeclare score_candidate with different
# parameter names than the base (current vs current_embedding), so keyword
# calls would break. Real issue — renaming the params is the fix.
include = ["src/waverider/graph_reasoner.py"]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies",
]


# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Directories to include in the knowledge graph build and analysis.
include = ["src", "benchmarks"]

[tool.dockg]
# Add extra directories to exclude beyond the built-in SKIP_DIRS.
exclude = ["bundles", "dist", "data", "lib", "old", "programs", "turtlend_package", "pepys", "waverider_missions"]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation"
sequence = [
    { shell = "cd src && pdoc --o ../docs waverider" },
]
